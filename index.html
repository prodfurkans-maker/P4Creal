
<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>NextGenLAB | P4C Yapay Zeka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      :root { 
        --app-height: 100dvh; 
        --brand-indigo: #818cf8;
        --brand-purple: #c084fc;
      }
      html, body {
        padding: 0; margin: 0; width: 100%; height: 100%;
        height: var(--app-height); overflow: hidden;
        position: fixed; font-family: 'Inter', sans-serif;
        background-color: #0b0e14; -webkit-font-smoothing: antialiased;
        touch-action: manipulation;
      }
      #root { height: 100%; display: flex; flex-direction: column; }
      
      .ethereal-bg {
        background: #0b0e14;
        background-image: 
          radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.2) 0px, transparent 50%),
          radial-gradient(at 50% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 70%);
        position: relative;
      }

      .ethereal-bg::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='1000' height='1000' viewBox='0 0 1000 1000' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 500 Q 250 400 500 500 T 1000 500' stroke='white' stroke-opacity='0.05' fill='transparent'/%3E%3C/svg%3E");
        background-size: cover;
        pointer-events: none;
        z-index: 0;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(50px) saturate(180%);
        -webkit-backdrop-filter: blur(50px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }

      .glass-pill {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .gradient-text {
        background: linear-gradient(135deg, #a5b4fc, #d8b4fe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .glow-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        width: 80%;
        margin: 1rem auto;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .float-animation { animation: float 8s ease-in-out infinite; }

      .main-cta {
        background: linear-gradient(135deg, #4f46e5, #9333ea);
        box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .main-cta:active { transform: scale(0.96); }
    </style>

}
</script>
</head>

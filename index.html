
<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>NextGenLAB | P4C Yapay Zeka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      :root { 
        --app-height: 100dvh; 
      }
      html, body {
        padding: 0; margin: 0; width: 100%; height: 100%;
        height: var(--app-height); overflow: hidden;
        position: fixed; font-family: 'Inter', sans-serif;
        background-color: #02040a; -webkit-font-smoothing: antialiased;
        touch-action: manipulation;
        color: white;
      }
      #root { height: 100%; display: flex; flex-direction: column; }
      
      /* Derin ve Ahenkli Mesh Gradient Arka Plan */
      .ethereal-bg {
        background: #02040a;
        background-image: 
          radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.2) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(147, 51, 234, 0.2) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(219, 39, 119, 0.1) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(30, 64, 175, 0.15) 0px, transparent 50%),
          radial-gradient(at 50% 50%, rgba(124, 58, 237, 0.05) 0px, transparent 80%);
        position: relative;
        overflow: hidden;
      }

      /* Dekoratif Işık Hüzmesi */
      .ethereal-bg::before {
        content: "";
        position: absolute;
        top: -10%; left: -10%; width: 120%; height: 120%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 1000 1000' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
        pointer-events: none;
      }

      /* Ana Glass Card */
      .glass-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      /* Mobil Görünürlük İçin Geliştirilmiş Deep Glass */
      .deep-glass {
        background: rgba(0, 0, 0, 0.4) !important;
        backdrop-filter: blur(25px) !important;
        -webkit-backdrop-filter: blur(25px) !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        color: white !important;
      }

      .user-pill {
        background: rgba(79, 70, 229, 0.2);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .gradient-text {
        background: linear-gradient(135deg, #a5b4fc, #f472b6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
        50% { box-shadow: 0 0 25px rgba(99, 102, 241, 0.6); }
      }
      .glow-animation { animation: pulse-glow 3s ease-in-out infinite; }

      .main-cta {
        background: linear-gradient(135deg, #6366f1, #a855f7);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .main-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4); }
      .main-cta:active { transform: scale(0.95); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",

    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>

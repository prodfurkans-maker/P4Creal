
<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>NextGenLAB | P4C Yapay Zeka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      :root { 
        --app-height: 100dvh; 
        --brand-indigo: #6366f1;
        --brand-purple: #a855f7;
        --bg-dark: #0e1116;
      }
      html, body {
        padding: 0; margin: 0; width: 100%; height: 100%;
        height: var(--app-height); overflow: hidden;
        position: fixed; font-family: 'Inter', sans-serif;
        background-color: var(--bg-dark); -webkit-font-smoothing: antialiased;
        touch-action: manipulation;
        color: #f8fafc;
      }
      #root { height: 100%; display: flex; flex-direction: column; }
      
      .premium-dark-bg {
        background-color: var(--bg-dark);
        background-image: 
          radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 40%),
          radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.05) 0px, transparent 40%),
          radial-gradient(circle at center, rgba(14, 17, 22, 0) 0%, rgba(14, 17, 22, 1) 100%);
      }

      .glass-surface {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 
          0 4px 24px -1px rgba(0, 0, 0, 0.2),
          0 10px 40px -3px rgba(0, 0, 0, 0.3);
      }

      .user-bubble {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .gradient-highlight {
        background: linear-gradient(135deg, var(--brand-indigo), var(--brand-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
      }

      .input-glow:focus-within {
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        border-color: rgba(99, 102, 241, 0.3);
      }

      @keyframes subtle-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-8px) scale(1.01); }
      }
      .float-animation { animation: subtle-float 8s ease-in-out infinite; }
      
      .cta-premium {
        background: linear-gradient(145deg, #1e1b4b, #312e81);
        border: 1px solid rgba(99, 102, 241, 0.2);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .cta-premium:hover {
        background: linear-gradient(145deg, #312e81, #3730a3);
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        transform: translateY(-2px);
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/": "https://esm.sh/react@18.2.0/",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "@google/genai": "https://esm.sh/@google/genai@1.41.0",
        "react-dom/": "https://esm.sh/react-dom@18.2.0/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>

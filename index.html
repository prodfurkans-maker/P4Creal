
<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>NextGenLAB | P4C Yapay Zeka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      :root { 
        --app-height: 100dvh; 
        --brand-indigo: #4f46e5;
        --brand-purple: #9333ea;
        --bg-light: #f8fafc;
      }
      html, body {
        padding: 0; margin: 0; width: 100%; height: 100%;
        height: var(--app-height); overflow: hidden;
        position: fixed; font-family: 'Inter', sans-serif;
        background-color: var(--bg-light); -webkit-font-smoothing: antialiased;
        touch-action: manipulation;
        color: #1e293b;
      }
      #root { height: 100%; display: flex; flex-direction: column; }
      
      .premium-light-bg {
        background-color: #fcfdfe;
        background-image: 
          radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 40%),
          radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.05) 0px, transparent 40%),
          radial-gradient(at 50% 100%, #f1f5f9 0px, transparent 100%);
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 
          0 4px 12px -1px rgba(0, 0, 0, 0.03),
          0 10px 25px -3px rgba(0, 0, 0, 0.05);
      }

      .ai-bubble {
        background: white;
        border: 1px solid #f1f5f9;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.01), 0 2px 4px -1px rgba(0,0,0,0.01);
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .gradient-highlight {
        background: linear-gradient(135deg, var(--brand-indigo), var(--brand-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
      }

      .input-glow:focus-within {
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
        border-color: rgba(79, 70, 229, 0.2);
      }

      @keyframes subtle-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      .float-animation { animation: subtle-float 6s ease-in-out infinite; }
      
      .cta-premium {
        background: white;
        border: 1px solid #e2e8f0;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .cta-premium:hover {
        border-color: var(--brand-indigo);
        box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.1);
        transform: translateY(-1px);
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/": "https://esm.sh/react@18.2.0/",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "@google/genai": "https://esm.sh/@google/genai@1.41.0",
        "react-dom/": "https://esm.sh/react-dom@18.2.0/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>

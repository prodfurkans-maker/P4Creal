
<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>NextGenLAB | P4C Yapay Zeka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      :root { 
        --app-height: 100dvh; 
      }
      html, body {
        padding: 0; margin: 0; width: 100%; height: 100%;
        height: var(--app-height); overflow: hidden;
        position: fixed; font-family: 'Inter', sans-serif;
        background-color: #0f172a; 
        -webkit-font-smoothing: antialiased;
        touch-action: manipulation;
        color: #f1f5f9;
      }
      #root { height: 100%; display: flex; flex-direction: column; }
      
      /* Space Navy Aydınlık Mesh Arka Plan */
      .ethereal-bg {
        background-color: #0f172a;
        background-image: 
          radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.2) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(30, 64, 175, 0.2) 0px, transparent 50%);
        position: relative;
        overflow: hidden;
      }

      /* ChatGPT Stili Sohbet Katmanı */
      .glass-card {
        background: rgba(30, 41, 59, 0.4);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* Zarif ve Kompakt Mesajlar */
      .chat-bubble-ai {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .chat-bubble-user {
        background: rgba(79, 70, 229, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .gradient-text {
        background: linear-gradient(135deg, #a5b4fc, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes float-gentle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .hero-float { animation: float-gentle 5s ease-in-out infinite; }

      .glow-button {
        background: linear-gradient(135deg, #4f46e5, #0ea5e9);
        box-shadow: 0 10px 30px -5px rgba(79, 70, 229, 0.5);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .glow-button:active { transform: scale(0.95); opacity: 0.9; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>

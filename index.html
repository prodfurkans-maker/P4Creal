
<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>NextGenLAB | P4C Yapay Zeka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      :root { --app-height: 100dvh; }
      html, body {
        padding: 0; margin: 0; width: 100%; height: 100%;
        height: var(--app-height); overflow: hidden;
        position: fixed; font-family: 'Inter', sans-serif;
        background-color: #0b0f1a; 
        -webkit-font-smoothing: antialiased;
        touch-action: manipulation;
        color: #f1f5f9;
        max-width: 100vw;
      }
      #root { height: 100%; display: flex; flex-direction: column; width: 100%; overflow: hidden; }
      .ethereal-bg {
        background-color: #080b14;
        background-image: 
          radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.25) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(56, 189, 248, 0.2) 0px, transparent 50%),
          radial-gradient(at 50% 50%, rgba(30, 41, 175, 0.1) 0px, transparent 80%);
        position: relative;
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.3);
        backdrop-filter: blur(40px) saturate(200%);
        -webkit-backdrop-filter: blur(40px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .chat-bubble-ai {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
        box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
      }
      .chat-bubble-user {
        background: linear-gradient(135deg, rgba(79, 70, 229, 0.4), rgba(99, 102, 241, 0.3));
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 15px 40px -10px rgba(79, 70, 229, 0.3);
      }
      .gradient-text {
        background: linear-gradient(135deg, #e0e7ff, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      @keyframes float-gentle {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-15px) scale(1.02); }
      }
      .hero-float { animation: float-gentle 6s ease-in-out infinite; width: 100%; }
      .glow-button {
        background: linear-gradient(135deg, #6366f1, #0ea5e9);
        box-shadow: 0 20px 60px -10px rgba(99, 102, 241, 0.6);
      }
      .glow-button:hover {
        box-shadow: 0 30px 80px -5px rgba(99, 102, 241, 0.8);
        transform: translateY(-5px);
      }
      .tracking-tightest { tracking-spacing: -0.05em; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>


<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>NextGenLAB | P4C Yapay Zeka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      :root { 
        --app-height: 100dvh; 
      }
      html, body {
        padding: 0; margin: 0; width: 100%; height: 100%;
        height: var(--app-height); overflow: hidden;
        position: fixed; font-family: 'Inter', sans-serif;
        /* Daha açık, ferah lacivert arka plan */
        background-color: #0f172a; 
        -webkit-font-smoothing: antialiased;
        touch-action: manipulation;
        color: #e2e8f0;
      }
      #root { height: 100%; display: flex; flex-direction: column; }
      
      /* Aydınlatılmış Modern Mesh Gradient */
      .ethereal-bg {
        background-color: #0f172a;
        background-image: 
          radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(14, 165, 233, 0.2) 0px, transparent 50%),
          radial-gradient(at 50% 50%, rgba(79, 70, 229, 0.1) 0px, transparent 80%),
          radial-gradient(at 0% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
        position: relative;
        overflow: hidden;
      }

      /* Mobilde Gözü Yormayan Glassmorphism */
      .glass-card {
        background: rgba(30, 41, 59, 0.5);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.3);
      }

      /* Zarif Mesaj Balonları */
      .chat-bubble-ai {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        color: #f1f5f9;
      }
      .chat-bubble-user {
        background: linear-gradient(135deg, rgba(79, 70, 229, 0.4), rgba(99, 102, 241, 0.4));
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .gradient-text {
        background: linear-gradient(135deg, #818cf8, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes soft-pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; transform: scale(1.02); }
      }
      .soft-pulse { animation: soft-pulse 4s ease-in-out infinite; }

      /* Mobil için küçültülmüş butonlar */
      .main-btn {
        background: linear-gradient(135deg, #4f46e5, #0ea5e9);
        transition: all 0.3s ease;
      }
      .main-btn:active { transform: scale(0.96); opacity: 0.9; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
